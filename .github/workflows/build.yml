name: Build Visit Woliat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Scaffold Visit Woliat Project Files
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/visitwoliat/app/data
          mkdir -p app/src/main/java/com/visitwoliat/app/localization
          mkdir -p app/src/main/java/com/visitwoliat/app/navigation
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/components
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/screens
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/theme

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VisitWoliat"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.visitwoliat.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.visitwoliat.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation(platform("androidx.compose:compose-bom:2024.02.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.navigation:navigation-compose:2.7.6")

              // Image loading with cache and fallback support
              implementation("io.coil-kt:coil-compose:2.6.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Visit Woliat</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.VisitWoliat" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Required for loading verified destination photographs -->
              <uses-permission android:name="android.permission.INTERNET" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.VisitWoliat">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.VisitWoliat">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Color.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.ui.graphics.Color

          val ForestGreenPrimary = Color(0xFF0F382A)
          val ForestGreenLight = Color(0xFF1D5A45)
          val ForestGreenDark = Color(0xFF082219)
          val WarmGold = Color(0xFFD4AF37)
          val WarmGoldDark = Color(0xFFA5801C)
          val IvoryBackground = Color(0xFFFAF8F2)
          val IvorySurface = Color(0xFFFFFFFF)
          val IvorySurfaceVariant = Color(0xFFF3EFE6)
          val CharcoalText = Color(0xFF1C1E1B)
          val CharcoalMuted = Color(0xFF555B53)
          val BorderSubtle = Color(0xFFE2DED5)

          // 6-Tier Evidence Classification Tints
          val BadgeDocumentedBg = Color(0xFFE8F5E9)
          val BadgeDocumentedFg = Color(0xFF1B5E20)
          val BadgeMultiSourceBg = Color(0xFFE0F2F1)
          val BadgeMultiSourceFg = Color(0xFF004D40)
          val BadgeOralTraditionBg = Color(0xFFFFF8E1)
          val BadgeOralTraditionFg = Color(0xFFB78103)
          val BadgeDisputedBg = Color(0xFFFFE0B2)
          val BadgeDisputedFg = Color(0xFFE65100)
          val BadgeUnverifiedBg = Color(0xFFEFEBE9)
          val BadgeUnverifiedFg = Color(0xFF4E342E)
          val BadgeUnknownBg = Color(0xFFECEFF1)
          val BadgeUnknownFg = Color(0xFF37474F)
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Type.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          val Typography = Typography(
              headlineLarge = TextStyle(fontFamily = FontFamily.Serif, fontWeight = FontWeight.Bold, fontSize = 26.sp),
              headlineMedium = TextStyle(fontFamily = FontFamily.Serif, fontWeight = FontWeight.SemiBold, fontSize = 20.sp),
              titleLarge = TextStyle(fontWeight = FontWeight.Bold, fontSize = 18.sp),
              titleMedium = TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 15.sp),
              bodyLarge = TextStyle(fontWeight = FontWeight.Normal, fontSize = 14.sp),
              bodyMedium = TextStyle(fontWeight = FontWeight.Normal, fontSize = 13.sp),
              labelSmall = TextStyle(fontWeight = FontWeight.Medium, fontSize = 11.sp)
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Theme.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable

          private val LightColorScheme = lightColorScheme(
              primary = ForestGreenPrimary,
              onPrimary = IvoryBackground,
              secondary = WarmGold,
              background = IvoryBackground,
              onBackground = CharcoalText,
              surface = IvorySurface,
              onSurface = CharcoalText,
              surfaceVariant = IvorySurfaceVariant
          )

          @Composable
          fun VisitWoliatTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = LightColorScheme, typography = Typography, content = content)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/data/Models.kt
          package com.visitwoliat.app.data

          enum class EvidenceClassification(val displayName: String) {
              DOCUMENTED("Documented Fact"),
              MULTIPLE_INDEPENDENT_SOURCES("Multi-Source Corroborated"),
              ORAL_TRADITION("Oral Tradition"),
              DISPUTED("Disputed"),
              UNVERIFIED("Unverified"),
              UNKNOWN("Unknown")
          }

          data class SourceCitation(
              val sourceId: String,
              val citationRef: String
          )

          data class SourceReference(
              val id: String,
              val author: String,
              val title: String,
              val year: String,
              val publisherOrJournal: String,
              val pageNumbers: String?,
              val urlOrDoi: String?,
              val evidenceType: String,
              val limitations: String
          )

          data class HistoricalKing(
              val id: String,
              val name: String,
              val alternativeSpellings: List<String>,
              val dynasty: String,
              val regnalOrder: String,
              val reignPeriod: String,
              val parents: String,
              val wivesAndAlliances: String,
              val childrenAndSuccession: String,
              val commandersAndAllies: String,
              val militaryAndCivicAchievements: String,
              val controversiesAndGaps: String,
              val evidenceClassification: EvidenceClassification,
              val citations: List<SourceCitation>
          )

          data class RoyalWoman(
              val id: String,
              val name: String,
              val royalRole: String,
              val associatedKingOrDynasty: String,
              val familyBackground: String,
              val marriageAlliance: String,
              val childrenAndInfluence: String,
              val evidenceClassification: EvidenceClassification,
              val citations: List<SourceCitation>
          )

          data class MilitaryInstitution(
              val id: String,
              val nameWolayttattuwa: String,
              val englishName: String,
              val roleOverview: String,
              val historicalPeriod: String,
              val jurisdictionAndHierarchy: String,
              val relationshipToKawo: String,
              val namedOfficeholders: String,
              val campaignsAndEarthworks: String,
              val evidenceClassification: EvidenceClassification,
              val citations: List<SourceCitation>
          )

          enum class DestinationCategory { ALL, MOUNTAINS, WATERFALLS, HISTORICAL_LANDMARKS, CULTURAL_SITES }

          data class Destination(
              val id: String,
              val name: String,
              val category: DestinationCategory,
              val location: String,
              val elevationOrSpecs: String,
              val imageUrl: String,
              val imageAttribution: String,
              val description: String,
              val visitorTips: String,
              val bestTimeToVisit: String
          )

          data class CulturalItem(
              val title: String,
              val nativeTerm: String,
              val category: String,
              val overview: String,
              val significance: String
          )
          EOF

