          package com.visitwoliat.app.navigation
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.ui.graphics.vector.ImageVector

          sealed class Screen(val route: String, val icon: ImageVector) {
              object Home : Screen("home", Icons.Default.Home)
              object History : Screen("history", Icons.Default.HistoryEdu)
              object Explore : Screen("explore", Icons.Default.Explore)
              object Culture : Screen("culture", Icons.Default.Festival)
              object Languages : Screen("languages", Icons.Default.Translate)
              object About : Screen("about", Icons.Default.Info)
          }

          val bottomNavItems = listOf(
              Screen.Home,
              Screen.History,
              Screen.Explore,
              Screen.Culture,
              Screen.Languages,
              Screen.About
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/MainActivity.kt
          package com.visitwoliat.app
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.*
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.navigation.NavGraph.Companion.findStartDestination
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import com.visitwoliat.app.navigation.Screen
          import com.visitwoliat.app.navigation.bottomNavItems
          import com.visitwoliat.app.ui.screens.*
          import com.visitwoliat.app.ui.theme.ForestGreenDark
          import com.visitwoliat.app.ui.theme.IvoryBackground
          import com.visitwoliat.app.ui.theme.VisitWoliatTheme
          import com.visitwoliat.app.ui.theme.WarmGold

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      VisitWoliatTheme {
                          val navController = rememberNavController()
                          val navBackStackEntry by navController.currentBackStackEntryAsState()
                          val currentRoute = navBackStackEntry?.destination?.route

                          Scaffold(
                              modifier = Modifier.fillMaxSize(),
                              bottomBar = {
                                  NavigationBar(containerColor = ForestGreenDark, contentColor = IvoryBackground) {
                                      bottomNavItems.forEach { screen ->
                                          val selected = currentRoute == screen.route
                                          NavigationBarItem(
                                              selected = selected,
                                              onClick = {
                                                  navController.navigate(screen.route) {
                                                      popUpTo(navController.graph.findStartDestination().id) { saveState = true }
                                                      launchSingleTop = true
                                                      restoreState = true
                                                  }
                                              },
                                              icon = { Icon(screen.icon, contentDescription = null, tint = if (selected) WarmGold else IvoryBackground.copy(alpha = 0.5f)) },
                                              label = { Text(screen.route.replaceFirstChar { it.uppercase() }, color = if (selected) WarmGold else IvoryBackground.copy(alpha = 0.5f)) }
                                          )
                                      }
                                  }
                              }
                          ) { innerPadding ->
                              NavHost(navController = navController, startDestination = Screen.Home.route, modifier = Modifier.padding(innerPadding)) {
                                  composable(Screen.Home.route) { HomeScreen({ navController.navigate(Screen.Explore.route) }, { navController.navigate(Screen.History.route) }) }
                                  composable(Screen.History.route) { HistoryScreen() }
                                  composable(Screen.Explore.route) { ExploreScreen() }
                                  composable(Screen.Culture.route) { CultureScreen() }
                                  composable(Screen.Languages.route) { LanguageScreen() }
                                  composable(Screen.About.route) { AboutScreen() }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload APK to Download
        uses: actions/upload-artifact@v4
        with:
          name: VisitWoliat-App
          path: app/build/outputs/apk/debug/*.apk
