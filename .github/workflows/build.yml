                  MilitaryInstitution("toora_gadawa", "Toora Gadaawaa", "Commander of the Spear Vanguard", "Tactical battlefield commander leading the elite infantry spear regiments (Toora).", "17th-19th Century", "Subordinate to the Supreme Gadawa; commanded village regiments.", "Guarded trench entries (kella penga) during invasions.", EvidenceClassification.MULTI_SOURCE, listOf(SourceCitation("S4", "p. 82"), SourceCitation("S6", "p. 38"))),
