name: Build Visit Woliat APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Scaffold Visit Woliat Project Files
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/visitwoliat/app/data
          mkdir -p app/src/main/java/com/visitwoliat/app/localization
          mkdir -p app/src/main/java/com/visitwoliat/app/navigation
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/components
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/screens
          mkdir -p app/src/main/java/com/visitwoliat/app/ui/theme

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VisitWoliat"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.visitwoliat.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.visitwoliat.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              val composeBom = platform("androidx.compose:compose-bom:2024.02.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Visit Woliat</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.VisitWoliat" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.VisitWoliat">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.VisitWoliat">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Color.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.ui.graphics.Color

          val ForestGreenPrimary = Color(0xFF0F382A)
          val ForestGreenLight = Color(0xFF1D5A45)
          val ForestGreenDark = Color(0xFF082219)
          val WarmGold = Color(0xFFD4AF37)
          val WarmGoldLight = Color(0xFFE5C768)
          val WarmGoldDark = Color(0xFFA5801C)
          val IvoryBackground = Color(0xFFFAF8F2)
          val IvorySurface = Color(0xFFFFFFFF)
          val IvorySurfaceVariant = Color(0xFFF3EFE6)
          val CharcoalText = Color(0xFF1C1E1B)
          val CharcoalMuted = Color(0xFF555B53)
          val BorderSubtle = Color(0xFFE2DED5)
          val DocumentedBadgeBg = Color(0xFFE8F5E9)
          val DocumentedBadgeText = Color(0xFF1B5E20)
          val OralTraditionBadgeBg = Color(0xFFFFF8E1)
          val OralTraditionBadgeText = Color(0xFFB78103)
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Type.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          val Typography = Typography(
              headlineLarge = TextStyle(fontFamily = FontFamily.Serif, fontWeight = FontWeight.Bold, fontSize = 26.sp),
              headlineMedium = TextStyle(fontFamily = FontFamily.Serif, fontWeight = FontWeight.SemiBold, fontSize = 20.sp),
              titleLarge = TextStyle(fontWeight = FontWeight.Bold, fontSize = 18.sp),
              titleMedium = TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 15.sp),
              bodyLarge = TextStyle(fontWeight = FontWeight.Normal, fontSize = 14.sp),
              bodyMedium = TextStyle(fontWeight = FontWeight.Normal, fontSize = 13.sp),
              labelSmall = TextStyle(fontWeight = FontWeight.Medium, fontSize = 11.sp)
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/theme/Theme.kt
          package com.visitwoliat.app.ui.theme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable

          private val LightColorScheme = lightColorScheme(
              primary = ForestGreenPrimary,
              onPrimary = IvoryBackground,
              secondary = WarmGold,
              background = IvoryBackground,
              onBackground = CharcoalText,
              surface = IvorySurface,
              onSurface = CharcoalText
          )

          @Composable
          fun VisitWoliatTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = LightColorScheme, typography = Typography, content = content)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/data/Models.kt
          package com.visitwoliat.app.data

          enum class EvidenceType { DOCUMENTED_FACT, ORAL_TRADITION }
          enum class DestinationCategory { ALL, MOUNTAINS, WATERFALLS, HISTORICAL_LANDMARKS, CULTURAL_SITES }

          data class HistoricalFigure(
              val id: String,
              val name: String,
              val roleTitle: String,
              val reignOrPeriod: String,
              val dynasty: String,
              val description: String,
              val militaryLegacy: String,
              val evidenceType: EvidenceType,
              val citations: List<String>
          )

          data class TimelineEvent(
              val yearApprox: String,
              val title: String,
              val summary: String,
              val evidenceType: EvidenceType,
              val sourceRef: String
          )

          data class Destination(
              val id: String,
              val name: String,
              val category: DestinationCategory,
              val location: String,
              val elevationOrSpecs: String,
              val description: String,
              val visitorTips: String,
              val bestTimeToVisit: String
          )

          data class CulturalItem(
              val title: String,
              val nativeTerm: String,
              val category: String,
              val overview: String,
              val significance: String
          )
          EOF

