                  CulturalItem("Enset & Culinary Tradition", "ኡታ / ሙጩዋ (Utta & Muchuwa)", "Centered around Enset (the 'false banana' plant). Culinary staples include Muchuwa, Baaccira, and Godere (taro root), accompanied by dairy and spiced herbs.", "Drought-resilient indigenous agricultural marvel sustaining communities for millennia.")
              )
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/localization/AppLanguage.kt
          package com.visitwoliat.app.localization
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          enum class AppLanguage(val code: String, val displayName: String, val nativeName: String) {
              ENGLISH("en", "English", "English"),
              AMHARIC("am", "Amharic", "አማርኛ"),
              WOLAITIGNA("wal", "Wolaitigna", "Wolayttattuwa")
          }

          object TranslationStrings {
              private val translations = mapOf(
                  AppLanguage.ENGLISH to mapOf(
                      "app_title" to "VISIT WOLIAT",
                      "slogan" to "Discover the History. Explore the Land.",
                      "sub_slogan" to "Southern Ethiopia's Sovereign Cradle of Heritage and Scenic Wonder",
                      "explore_destinations" to "Explore Destinations",
                      "discover_history" to "Discover History",
                      "featured_destinations" to "Featured Destinations",
                      "history_title" to "Royal Archive & Institutions",
                      "explore_title" to "Destinations",
                      "culture_title" to "Living Traditions",
                      "languages_title" to "Select Language",
                      "about_title" to "About & Verification",
                      "search_placeholder" to "Search kings, titles, destinations..."
                  ),
                  AppLanguage.AMHARIC to mapOf(
