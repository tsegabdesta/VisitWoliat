          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/components/CommonComponents.kt
          package com.visitwoliat.app.ui.components
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import com.visitwoliat.app.data.EvidenceType
          import com.visitwoliat.app.localization.LanguageState
          import com.visitwoliat.app.localization.TranslationStrings
          import com.visitwoliat.app.ui.theme.*

          @Composable
          fun EvidenceBadge(evidenceType: EvidenceType, modifier: Modifier = Modifier) {
              val lang = LanguageState.currentLanguage
              val isDocumented = evidenceType == EvidenceType.DOCUMENTED_FACT
              val bg = if (isDocumented) DocumentedBadgeBg else OralTraditionBadgeBg
              val fg = if (isDocumented) DocumentedBadgeText else OralTraditionBadgeText
              val label = if (isDocumented) TranslationStrings.get("documented_fact", lang) else TranslationStrings.get("oral_tradition", lang)

              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(8.dp))
                      .background(bg)
                      .border(0.5.dp, fg.copy(alpha = 0.3f), RoundedCornerShape(8.dp))
                      .padding(horizontal = 8.dp, vertical = 3.dp)
              ) {
                  Text(text = label, color = fg, style = MaterialTheme.typography.labelSmall, fontWeight = FontWeight.SemiBold)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/ui/screens/HomeScreen.kt
          package com.visitwoliat.app.ui.screens
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Explore
          import androidx.compose.material.icons.filled.HistoryEdu
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.visitwoliat.app.data.VisitWoliatRepository
          import com.visitwoliat.app.localization.LanguageState
          import com.visitwoliat.app.localization.TranslationStrings
          import com.visitwoliat.app.ui.theme.*

          @Composable
          fun HomeScreen(onNavigateToExplore: () -> Unit, onNavigateToHistory: () -> Unit) {
              val lang = LanguageState.currentLanguage

              LazyColumn(
                  modifier = Modifier.fillMaxSize().background(IvoryBackground),
                  contentPadding = PaddingValues(bottom = 96.dp)
              ) {
                  item {
                      Box(
                          modifier = Modifier.fillMaxWidth().background(ForestGreenDark).padding(horizontal = 20.dp, vertical = 26.dp)
                      ) {
                          Column {
                              Text(text = TranslationStrings.get("app_title", lang), style = MaterialTheme.typography.headlineLarge, color = WarmGold)
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(text = TranslationStrings.get("slogan", lang), style = MaterialTheme.typography.titleMedium, color = IvoryBackground)
                              Text(text = TranslationStrings.get("sub_slogan", lang), style = MaterialTheme.typography.bodyMedium, color = IvoryBackground.copy(alpha = 0.8f))
                              Spacer(modifier = Modifier.height(18.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Button(
                                      onClick = onNavigateToExplore,
                                      colors = ButtonDefaults.buttonColors(containerColor = WarmGold),
                                      shape = RoundedCornerShape(10.dp)
                                  ) {
                                      Icon(Icons.Default.Explore, contentDescription = null, tint = CharcoalText)
                                      Spacer(modifier = Modifier.width(6.dp))
                                      Text(TranslationStrings.get("explore_destinations", lang), color = CharcoalText, fontWeight = FontWeight.Bold)
                                  }
                                  OutlinedButton(
                                      onClick = onNavigateToHistory,
                                      shape = RoundedCornerShape(10.dp),
                                      colors = ButtonDefaults.outlinedButtonColors(contentColor = IvoryBackground)
                                  ) {
                                      Icon(Icons.Default.HistoryEdu, contentDescription = null, tint = IvoryBackground)
                                      Spacer(modifier = Modifier.width(6.dp))
                                      Text(TranslationStrings.get("discover_history", lang), color = IvoryBackground, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Spacer(modifier = Modifier.height(20.dp))
                      Text(
                          text = TranslationStrings.get("featured_destinations", lang),
                          style = MaterialTheme.typography.titleLarge,
                          color = ForestGreenPrimary,
                          modifier = Modifier.padding(horizontal = 20.dp)
                      )
                      Spacer(modifier = Modifier.height(12.dp))
                      LazyRow(
                          contentPadding = PaddingValues(horizontal = 20.dp),
                          horizontalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          items(VisitWoliatRepository.destinations) { destination ->
                              Card(
                                  modifier = Modifier.width(260.dp).clickable { onNavigateToExplore() },
                                  shape = RoundedCornerShape(14.dp),
                                  colors = CardDefaults.cardColors(containerColor = IvorySurface),
                                  elevation = CardDefaults.cardElevation(2.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Box(
                                          modifier = Modifier.fillMaxWidth().height(100.dp).clip(RoundedCornerShape(10.dp)).background(ForestGreenLight.copy(alpha = 0.25f)),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(destination.name.take(2).uppercase(), style = MaterialTheme.typography.headlineLarge, color = ForestGreenPrimary)
