          package com.visitwoliat.app.ui.components
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.SubcomposeAsyncImage
          import coil.request.ImageRequest
          import com.visitwoliat.app.data.EvidenceClassification
          import com.visitwoliat.app.ui.theme.*

          @Composable
          fun EvidenceBadge(classification: EvidenceClassification, modifier: Modifier = Modifier) {
              val (bg, fg) = when (classification) {
                  EvidenceClassification.DOCUMENTED -> Color(0xFFE8F5E9) to Color(0xFF1B5E20)
                  EvidenceClassification.MULTI_SOURCE -> Color(0xFFE0F2F1) to Color(0xFF004D40)
                  EvidenceClassification.ORAL_TRADITION -> Color(0xFFFFF8E1) to Color(0xFFB78103)
                  EvidenceClassification.DISPUTED -> Color(0xFFFFE0B2) to Color(0xFFE65100)
                  EvidenceClassification.UNVERIFIED -> Color(0xFFEFEBE9) to Color(0xFF4E342E)
                  EvidenceClassification.UNKNOWN -> Color(0xFFECEFF1) to Color(0xFF37474F)
              }

              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(6.dp))
                      .background(bg)
                      .border(0.5.dp, fg.copy(alpha = 0.3f), RoundedCornerShape(6.dp))
                      .padding(horizontal = 6.dp, vertical = 2.dp)
              ) {
                  Text(text = classification.label, color = fg, fontSize = 10.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          @Composable
          fun DestinationImage(
              imageUrl: String,
              contentDescription: String,
              modifier: Modifier = Modifier,
              fallbackInitials: String = "VW"
          ) {
              SubcomposeAsyncImage(
                  model = ImageRequest.Builder(LocalContext.current)
                      .data(imageUrl)
                      .crossfade(true)
                      .build(),
                  contentDescription = contentDescription,
                  contentScale = ContentScale.Crop,
                  modifier = modifier,
                  loading = {
                      Box(
                          modifier = Modifier.fillMaxSize().background(ForestGreenLight.copy(alpha = 0.2f)),
                          contentAlignment = Alignment.Center
                      ) {
                          CircularProgressIndicator(color = WarmGold, modifier = Modifier.size(28.dp), strokeWidth = 2.dp)
                      }
                  },
                  error = {
                      Box(
                          modifier = Modifier.fillMaxSize().background(ForestGreenPrimary),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(text = fallbackInitials, style = MaterialTheme.typography.headlineLarge, color = WarmGold)
                      }
                  }
              )
          }
          EOF

