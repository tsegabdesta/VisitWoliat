              val culturalHeritage = listOf(
                  CulturalItem("Gifaataa New Year Festival", "ጊፋታ (Gifaataa)", "The seasonal turning point marking the end of the rainy season and dawn of harvest. Rooted in reconciliation, where past grudges are formally resolved before the New Year begins.", "Inscribed by UNESCO as a masterpiece of Intangible Cultural Heritage of Humanity (2025)."),
