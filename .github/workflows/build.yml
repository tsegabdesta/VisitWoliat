          cat << 'EOF' > app/src/main/java/com/visitwoliat/app/localization/AppLanguage.kt
          package com.visitwoliat.app.localization
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          enum class AppLanguage(val code: String, val displayName: String, val nativeName: String) {
              ENGLISH("en", "English", "English"),
              AMHARIC("am", "Amharic", "አማርኛ"),
              WOLAITIGNA("wal", "Wolaitigna", "Wolayttattuwa")
          }

          object TranslationStrings {
              private val translations = mapOf(
                  AppLanguage.ENGLISH to mapOf(
                      "app_title" to "VISIT WOLIAT",
                      "slogan" to "Discover the History. Explore the Land.",
                      "sub_slogan" to "Southern Ethiopia's Sovereign Cradle of Heritage and Scenic Wonder",
                      "explore_destinations" to "Explore Destinations",
                      "discover_history" to "Discover History",
                      "featured_destinations" to "Featured Destinations",
                      "featured_culture" to "Cultural Treasures",
                      "documented_fact" to "Documented Fact",
                      "oral_tradition" to "Oral Tradition",
                      "search_placeholder" to "Search landmarks, mountains...",
                      "history_title" to "Kingdom & Heritage",
                      "explore_title" to "Destinations",
                      "culture_title" to "Living Traditions",
                      "languages_title" to "Choose Language",
                      "about_title" to "About Project",
                      "no_results" to "No records matching your search."
                  ),
                  AppLanguage.AMHARIC to mapOf(
                      "app_title" to "ወላይታን ይጎብኙ",
                      "slogan" to "ታሪኩን ይወቁ። ምድሪቱን ይጎብኙ።",
                      "sub_slogan" to "የደቡብ ኢትዮጵያ ታላቅ ታሪካዊ ቅርስ እና የተፈጥሮ ውበት መፍለቂያ",
                      "explore_destinations" to "መዳረሻዎችን ይጎብኙ",
                      "discover_history" to "ታሪኩን ይመርምሩ",
                      "featured_destinations" to "ተመራጭ የቱሪዝም ስፍራዎች",
                      "featured_culture" to "የባህል ቅርሶች",
                      "documented_fact" to "በሰነድ የተረጋገጠ",
                      "oral_tradition" to "የአፍ ታሪክ / ትውፊት",
                      "search_placeholder" to "ቦታዎችን፣ ቅርሶችን ፈልግ...",
                      "history_title" to "የወላይታ መንግሥት ታሪክ",
                      "explore_title" to "የጉብኝት መዳረሻዎች",
                      "culture_title" to "ህያው ባህል እና ቋንቋ",
                      "languages_title" to "ቋንቋ ይምረጡ",
                      "about_title" to "ስለ ፕሮጀክቱ",
                      "no_results" to "የተፈለገው መረጃ አልተገኘም።"
                  ),
                  AppLanguage.WOLAITIGNA to mapOf(
                      "app_title" to "WOLAYTA YAA BE’ITE",
                      "slogan" to "Tarikiyan Era! Sa'aa Yuuyi Be'ite!",
                      "sub_slogan" to "Tohssa biitta kawotethaa tarikenne medhettaa lo'otethaa erite",
                      "explore_destinations" to "Sohootu Yuuyite",
                      "discover_history" to "Tariikiyaa Erite",
                      "featured_destinations" to "Dootettiya Sohotu",
                      "featured_culture" to "Woganne Naqaashaa",
                      "documented_fact" to "Xaafeettidi Geeshshettiis",
                      "oral_tradition" to "Doonan Yiya Hayttaa",
                      "search_placeholder" to "Sohota, Kawota koyite...",
                      "history_title" to "Kawotethaa Tariikiyaa",
