                  SourceReference("S2", "Abesha Shirko Lambebo", "A Study of Reconstructing the Historical Link between Wolaitta and Damot Kingdom", "2016", "IJELH, Vol. 4(4)", "pp. 265-285", "Historiographical analysis & elder traditions", "Focuses on medieval Damot-Wolaita continuity."),
                  SourceReference("S3", "Abesha Shirko Lambebo & Ratnakar Mohapatra", "State Formation of Wolaitta and Its Kingdom up to 1894", "2020", "Int. Journal of Psychosocial Rehabilitation, Vol. 24(5)", "pp. 15-28", "Regional archives & indigenous administrative titles", "Reigns before 1700 rely on uncalibrated generational spans."),
                  SourceReference("S4", "Remo Chiatti", "The Kingdom of Wallamo (Ethiopia): A Socio-Political Reconstruction", "1984", "Ph.D. Dissertation, University of Pennsylvania", "pp. 45-120", "Historical anthropology & royal court records", "Orthography differs from modern Wolayttattuwa."),
                  SourceReference("S5", "Bahru Zewde", "A History of Modern Ethiopia 1855-1991 (2nd Ed.)", "2002", "James Currey / Addis Ababa University Press", "pp. 64-66", "Peer-reviewed documentary history", "Focuses on late-19th century southern campaigns."),
                  SourceReference("S6", "Abraham Babanto", "Lamelamituwa Wolaita: Tintawituwana Zareyituwa", "1979", "Addis Ababa: United Press", "pp. 12-48", "First indigenous printed compilation of oral genealogies", "Synthesizes oral recitations without critical source distinction."),
                  SourceReference("S7", "J.-G. Vanderheym", "Une expédition avec le négous Ménélik: vingt mois en Abyssinie", "1896", "Paris: Librairie Hachette", "pp. 82-114", "Contemporaneous European eyewitness account", "19th-century French war correspondent perspective."),
                  SourceReference("S8", "Steven A. Brandt, Ralf Vogelsang et al.", "Late Quaternary Hunter-Gatherer Adaptations at Mochena Borago", "2012 / 2020", "Quaternary International / J. Anthropological Archaeology", "pp. 14-30", "Radiocarbon-dated archaeological excavations", "Archaeological data; distinct from political history.")
              )

              val kings = listOf(
                  HistoricalKing(
                      "tona_gaga", "Kawo Tona Gaga", "Tigre-Malla Dynasty", "17th King of Tigre / 56th Traditional Monarch",
                      "c. 1890 – December 1894 CE", "Father: Kawo Gaga Gobe; Mother: Unknown", "Personal names unrecorded in archives; maintained regional alliances",
